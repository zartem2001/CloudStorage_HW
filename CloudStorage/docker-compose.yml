version: '3.8'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: clouddb
      POSTGRES_USER: clouduser
      POSTGRES_PASSWORD: cloudpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8888:8888"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/clouddb
      SPRING_DATASOURCE_USERNAME: clouduser
      SPRING_DATASOURCE_PASSWORD: cloudpass
      APP_STORAGE_LOCATION: /app/uploads
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads: