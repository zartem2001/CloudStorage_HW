server:
  port: 8888

spring:
  application:
    name: cloudstorage
  datasource:
    url: jdbc:postgresql://localhost:5432/clouddb
    username: clouduser
    password: cloudpass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  storage:
    location: ./uploads